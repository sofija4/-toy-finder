name: Keep app awake

# Free Streamlit apps go to sleep after 12 hours with no visitors.
# This opens the app every 3 hours and clicks the wake button if it fell asleep.
# It runs at 17 minutes past the hour because GitHub delays (and sometimes skips)
# scheduled runs right on the hour, when it's busiest.
#
# GitHub also pauses scheduled workflows in public repos after 60 days with no
# commits, without reliably telling you. So once a day this checks how long it's
# been, and after 50 days it fails on purpose so GitHub emails you.
# Committing anything (even a small README edit) resets the clock.

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours at :17 (UTC): wake check
    - cron: "47 13 * * *"    # once a day: wake check plus the 60-day check
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app and wake it if needed
        run: |
          python - <<'SCRIPT'
          import sys
          from playwright.sync_api import sync_playwright

          URL = "https://toyrecommender.streamlit.app/"
          WAKE_TEXT = "Yes, get this app back up"

          def find_wake_button(page):
              # check every frame, in case the button is inside an iframe
              for frame in page.frames:
                  try:
                      button = frame.get_by_role("button", name=WAKE_TEXT)
                      if button.count():
                          return button.first
                  except Exception:
                      pass  # a frame can disappear while the page is loading
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=90_000)
              page.wait_for_timeout(20_000)

              button = find_wake_button(page)
              if button:
                  print("The app was asleep. Clicking the wake button.")
                  button.click()
                  page.wait_for_timeout(120_000)  # booting takes a minute or two
              else:
                  print("The app is awake.")
                  page.wait_for_timeout(30_000)  # stay a bit so it counts as a visit

              still_asleep = find_wake_button(page) is not None
              browser.close()

          if still_asleep:
              sys.exit("The app still looks asleep. Open it yourself and check.")
          print("Done.")
          SCRIPT

      - name: Warn before GitHub pauses this workflow
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '47 13 * * *')
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $days days ago. GitHub pauses this workflow at 60."
          if [ "$days" -ge 50 ]; then
            echo "::error::No commits in $days days. Commit anything (even a small README edit) so GitHub doesn't pause this."
            exit 1
          fi
